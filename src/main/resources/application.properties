spring.application.name=paperless

# PostgreSQL - overridable via environment variables (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paperless}
spring.datasource.username=${DB_USER:paperless}
spring.datasource.password=${DB_PASSWORD:paperless}

# Hibernate creates/updates the schema from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# OpenAPI: Swagger UI shows the hand-written spec (static/openapi.yaml)
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

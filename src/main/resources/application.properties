spring.application.name=paperless

# PostgreSQL - overridable via environment variables (see docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paperless}
spring.datasource.username=${DB_USERNAME:paperless}
spring.datasource.password=${DB_PASSWORD:paperless}

# Hibernate creates/updates the schema from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

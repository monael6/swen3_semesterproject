spring.application.name=paperless

# PostgreSQL - overridable via environment variables (see docker-compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paperless}
spring.datasource.username=${DB_USERNAME:paperless}
spring.datasource.password=${DB_PASSWORD:paperless}

# Hibernate creates/updates the schema from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uploads (PDF documents from the web UI)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# RabbitMQ - overridable via environment variables (see docker-compose.yaml)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paperless}
# fail fast (503) instead of waiting 60 s when RabbitMQ is down
spring.rabbitmq.connection-timeout=5s
# Queue the OCR worker listens on
paperless.queue.ocr=${OCR_QUEUE:ocr-jobs}

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: paperless
      RABBITMQ_DEFAULT_PASS: paperless
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./paperless-rest
    environment:
      DB_URL: jdbc:postgresql://database:5432/paperless
      DB_USERNAME: paperless
      DB_PASSWORD: paperless
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: paperless
      RABBITMQ_PASSWORD: paperless
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ocr-worker:
    build: ./paperless-ocr-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: paperless
      RABBITMQ_PASSWORD: paperless
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./paperless-webui
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres-data:

spring.application.name=paperless-ocr-worker

# The worker has no HTTP endpoints; it only listens on RabbitMQ.
spring.main.web-application-type=none

# RabbitMQ - overridable via environment variables (see docker-compose.yaml)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paperless}

# Queue with OCR jobs (must match the REST server)
paperless.queue.ocr=${OCR_QUEUE:ocr-jobs}

# A message that fails is not put back into the queue endlessly
spring.rabbitmq.listener.simple.default-requeue-rejected=false
